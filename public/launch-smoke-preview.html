<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Launch smoke sprite preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #071923;
        color: #f2dba7;
      }

      main {
        display: grid;
        gap: 1rem;
        justify-items: center;
        padding: 2rem;
      }

      .stage {
        position: relative;
        width: min(640px, 88vw);
        aspect-ratio: 5 / 4;
        overflow: hidden;
        background-image: linear-gradient(45deg, #0c2734 25%, transparent 25%),
          linear-gradient(-45deg, #0c2734 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #0c2734 75%),
          linear-gradient(-45deg, transparent 75%, #0c2734 75%);
        background-position: 0 0, 0 12px, 12px -12px, -12px 0;
        background-size: 24px 24px;
        border: 1px solid rgb(242 219 167 / 35%);
      }

      .sprite {
        position: absolute;
        inset: 0;
        background-image: url("/assets/launch/rocket-smoke-sprite.png");
        background-position: calc(var(--column) * 50%) calc(var(--row) * 100%);
        background-repeat: no-repeat;
        background-size: 300% 200%;
      }

      .origin-marker {
        position: absolute;
        bottom: 10%;
        left: 50%;
        width: 14px;
        height: 14px;
        border: 2px solid #e96544;
        border-radius: 50%;
        box-shadow: 0 0 0 1px #071923;
        pointer-events: none;
        transform: translateX(-50%);
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      button {
        padding: 0.6rem 0.8rem;
        border: 1px solid #f2dba7;
        color: #071923;
        background: #f2dba7;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stage" aria-label="Six-frame smoke sprite preview">
        <div class="sprite" id="sprite"></div>
        <div class="origin-marker" aria-hidden="true"></div>
      </div>
      <div class="controls">
        <button id="toggle" type="button">Pause</button>
        <button id="next" type="button">Next frame</button>
        <output id="frame">Frame 1 / 6</output>
      </div>
    </main>
    <script>
      const frameCount = 6;
      const frameDelay = 180;
      const sprite = document.querySelector("#sprite");
      const frameOutput = document.querySelector("#frame");
      const toggle = document.querySelector("#toggle");
      const next = document.querySelector("#next");
      let frame = 0;
      let isPlaying = true;

      function renderFrame() {
        sprite.style.setProperty("--column", frame % 3);
        sprite.style.setProperty("--row", Math.floor(frame / 3));
        frameOutput.textContent = `Frame ${frame + 1} / ${frameCount}`;
      }

      setInterval(() => {
        if (!isPlaying) return;
        frame = (frame + 1) % frameCount;
        renderFrame();
      }, frameDelay);

      toggle.addEventListener("click", () => {
        isPlaying = !isPlaying;
        toggle.textContent = isPlaying ? "Pause" : "Play";
      });

      next.addEventListener("click", () => {
        isPlaying = false;
        toggle.textContent = "Play";
        frame = (frame + 1) % frameCount;
        renderFrame();
      });

      renderFrame();
    </script>
  </body>
</html>
